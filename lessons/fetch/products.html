<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: grid;
            /* width:100vw; */
            grid-template-columns: 1fr 11fr;
        }

        header {
            grid-column: span 2;
        }

        #CategoriesList {
            display: flex;
            flex-direction: column;
            width: 200px;
            height: 100vh;
            overflow-y: auto;
        }

        a {
            text-decoration: none;
            color: #007BFF;
            padding: 8px 16px;
            display: inline-block;
        }

        a:hover {
            background-color: #f0f0f0;
            color: #0056b3;
        }

        #Products {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 16px;
            padding: 16px;
        }

        .product {
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 16px;
            text-align: center;
            background-color: #fff;
        }

        .product img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
        }

        .product h4 {
            margin: 16px 0 8px;
            font-size: 1.2em;
        }

        .product p {
            margin: 8px 0;
            color: #555;
        }

        .product button {
            background-color: #007BFF;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
        }

        .product button:hover {
            background-color: #0056b3;
        }
    </style>
</head>

<body>

    <header>
    </header>
    <section id="CategoriesList"></section>
    <section id="Products">

    </section>



    <script>
        fetch('https://dummyjson.com/products/category-list')
            .then(res => res.json())
            .then(categories => {
                categories.forEach(cat => {
                    CategoriesList.innerHTML += `<a href="products.html?cat=${cat}"> ${cat.replace("-", " ")} </a>`;
                });

            });

        const queryString = window.location.search;
        const urlParams = new URLSearchParams(queryString);
        const cat = urlParams.get('cat');
        console.log(cat);
        if (cat) {
            fetch(`https://dummyjson.com/products/category/${cat}`)
                .then(res => res.json())
                .then(object => {

                    object.products.forEach(product => {
                        console.log(product)
                        Products.innerHTML += `
                    <div class="product"> 
                        <h4> ${product.title} </h4>    
                        <img src="${product.thumbnail}" />
                        <p>${product.description}</p>
                        <p>Price: $${product.price}</p>
                        <p>Rating: ${product.rating}</p>
                        <button>Add to Cart</button>
                    </div>
                    `;
                    });

                });
        } else {
            fetch('https://dummyjson.com/products')
                .then(res => res.json())
                .then(object => {

                    object.products.forEach(product => {
                        console.log(product)
                        Products.innerHTML += `
                    <div class="product"> 
                        <h4> ${product.title} </h4>    
                        <img src="${product.thumbnail}" />
                        <p>${product.description}</p>
                        <p>Price: $${product.price}</p>
                        <p>Rating: ${product.rating}</p>
                        <button>Add to Cart</button>
                    </div>
                    `;
                    });

                });
        }





    </script>
</body>

</html>
